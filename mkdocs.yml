site_name: Xymon
site_description: Unofficial preview of a central documentation site for the Xymon monitoring system
site_url: https://stefcoene.github.io/xymon-docs-preview/
repo_url: https://github.com/StefCoene/xymon-docs-preview
repo_name: StefCoene/xymon-docs-preview
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    scheme: xymon
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

hooks:
  - hooks/xymon_matrix.py

plugins:
  - search

extra_css:
  - stylesheets/xymon.css
extra_javascript:
  - javascripts/xymon.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  # "wiki:<section>" is replaced by that section of the xymon-wiki navigation (hooks/xymon_matrix.py),
  # so new wiki pages show up without changes here. "wiki:A,B" = the pages of A, then B as a subsection.
  - Overview: index.md
  - Manual: manual.md
  - Guides: "wiki:Guides"
  - Clients:
      - clients.md
      - Windows PowerShell: "wiki:Windows PowerShell client"
  - Plugins: plugins/README.md
  - Download: download.md
  - Community: community.md
  - Project: "wiki:About"
  - Contributing: "wiki:Contributing,Development"
  - About this preview:
      - about.md
      - Status icons: icons.md
      - Changelog: changelog.md
